name: Format expert-agent development branch

on:
  push:
    branches:
      - feature/python-local-ai-gateway

permissions:
  contents: write

concurrency:
  group: format-python-${{ github.ref }}
  cancel-in-progress: false

jobs:
  format:
    if: ${{ !startsWith(github.event.head_commit.message, '[autoformat]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the development branch
        uses: actions/checkout@v4
        with:
          ref: feature/python-local-ai-gateway
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ephemeral formatting tools
        run: python -m pip install autopep8==2.3.2 ruff

      - name: Format only the expert-agent changes
        shell: bash
        run: |
          FILES=(
            agents/01-dev-copilot/main.py
            agents/02-aegis-security/main.py
            agents/03-task-orchestrator/main.py
            agents/04-rag-chatbot/main.py
            agents/05-content-maestro/main.py
            agents/06-web-scraper/main.py
            agents/07-software-engineer/main.py
            agents/08-code-reviewer/main.py
            agents/09-test-engineer/main.py
            agents/10-data-analyst/main.py
            agents/11-api-architect/main.py
            agents/12-research-analyst/main.py
            core/src/toolixa_core/agent_runtime_cli.py
            core/src/toolixa_core/agent_tools/__init__.py
            core/src/toolixa_core/agent_tools/content.py
            core/src/toolixa_core/agent_tools/html.py
            core/src/toolixa_core/agent_tools/orchestration.py
            core/src/toolixa_core/agent_tools/security.py
            core/src/toolixa_core/runtime/agent.py
            tests/agents/test_expert_starter_agents.py
            tests/core/test_agent_runtime.py
          )
          autopep8 --in-place --aggressive --aggressive ${FILES[@]}
          ruff check --fix --select I ${FILES[@]}
          ruff format ${FILES[@]}

      - name: Commit formatted files to this branch only
        shell: bash
        run: |
          git diff --check
          if git diff --quiet; then
            echo 'No formatting changes were necessary.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- agents/01-dev-copilot/main.py agents/02-aegis-security/main.py agents/03-task-orchestrator/main.py agents/04-rag-chatbot/main.py agents/05-content-maestro/main.py agents/06-web-scraper/main.py agents/07-software-engineer/main.py agents/08-code-reviewer/main.py agents/09-test-engineer/main.py agents/10-data-analyst/main.py agents/11-api-architect/main.py agents/12-research-analyst/main.py core/src/toolixa_core/agent_runtime_cli.py core/src/toolixa_core/agent_tools/__init__.py core/src/toolixa_core/agent_tools/content.py core/src/toolixa_core/agent_tools/html.py core/src/toolixa_core/agent_tools/orchestration.py core/src/toolixa_core/agent_tools/security.py core/src/toolixa_core/runtime/agent.py tests/agents/test_expert_starter_agents.py tests/core/test_agent_runtime.py
          git commit -m '[autoformat] normalize expert-agent Python sources'
          git push origin HEAD:feature/python-local-ai-gateway
